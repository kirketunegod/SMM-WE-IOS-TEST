name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check access key secret
      env:
        KEY: ${{ secrets.GM_ACCESS_KEY }}
      run: |
        echo "access key length: ${#KEY}"
        if [ -z "$KEY" ]; then echo "GM_ACCESS_KEY is empty or missing"; exit 1; fi

    - name: Set up Igor and GameMaker runtime
      id: setup
      uses: bscotch/igor-setup@v1
      with:
        access-key: ${{ secrets.GM_ACCESS_KEY }}
        target-yyp: SMM_WE.yyp

    - name: Export Xcode project from GameMaker
      id: build
      uses: bscotch/igor-build@v1
      with:
        user-dir: ${{ steps.setup.outputs.user-dir }}
        yyp-path: SMM_WE.yyp
        platform: ios
        config: Default
        save-logs: 'true'

    - name: Build unsigned app with xcodebuild
      run: |
        XCPROJ=$(find "${{ steps.build.outputs.out-dir }}" -name "*.xcodeproj" -maxdepth 3 | head -n 1)
        echo "Xcode project: $XCPROJ"
        xcodebuild -list -project "$XCPROJ"
        SCHEME=$(xcodebuild -list -json -project "$XCPROJ" | python3 -c "import sys,json; print(json.load(sys.stdin)['project']['schemes'][0])")
        echo "Scheme: $SCHEME"

        xcodebuild -project "$XCPROJ" \
          -scheme "$SCHEME" \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath "$RUNNER_TEMP/dd" \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
          build

        APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name "*.app" -maxdepth 3 | head -n 1)
        mkdir -p "$GITHUB_WORKSPACE/out/Payload"
        cp -R "$APP" "$GITHUB_WORKSPACE/out/Payload/"
        cd "$GITHUB_WORKSPACE/out" && zip -qr game-unsigned.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-ipa
        path: out/*.ipa

    - name: Upload Igor logs
      if: always() && steps.build.outputs.log-dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: igor-logs
        path: ${{ steps.build.outputs.log-dir }}
        if-no-files-found: ignore
