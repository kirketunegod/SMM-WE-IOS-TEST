name: Build GameMaker iOS Game (.ipa)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar Igor (Forzando la autenticación de la sesión vía variables de entorno)
      - name: Setup Igor Environment
        uses: bscotch/igor-setup@v1
        with:
          target-yyp: "SMM_WE.yyp"
          access-key: ${{ secrets.GM_ACCESS_KEY }}
        env:
          # Estas variables de entorno obligan al instalador a validar tu cuenta y evitar el error 403
          USER: ${{ secrets.GM_USERNAME }}
          PASSWORD: ${{ secrets.GM_PASSWORD }}

      # 3. Exportar el proyecto a un proyecto nativo de Xcode
      - name: Build Xcode Project via Igor
        uses: bscotch/igor-build@v1
        with:
          project-path: "SMM_WE.yyp"
          target: "ios"
          username: ${{ secrets.GM_USERNAME }}
          password: ${{ secrets.GM_PASSWORD }}

      # 4. Compilar y archivar el proyecto Xcode desactivando firmas obligatorias
      - name: Archive Xcode Project (Unsigned)
        run: |
          xcodebuild archive \
            -project "build/ios/SMM_WE.xcodeproj" \
            -scheme "SMM_WE" \
            -archivePath $RUNNER_TEMP/SMM_WE.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      # 5. Exportar el archivo final (.ipa)
      - name: Export IPA File
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/SMM_WE.xcarchive \
            -exportOptionsPlist .github/workflows/ios/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # 6. Guardar y descargar el archivo .ipa
      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMM_WE-iOS-Build
          path: ${{ runner.temp }}/build_output/*.ipa
