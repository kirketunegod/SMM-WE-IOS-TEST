name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Configurar Credenciales de GameMaker
      run: |
        # Creamos la carpeta de preferencias del sistema para meter tus datos de inicio de sesión
        mkdir -p ~/.config/GameMakerStudio2
        echo '{
          "login": "${{ secrets.GM_USERNAME }}",
          "password": "${{ secrets.GM_PASSWORD }}",
          "will_login": true
        }' > ~/.config/GameMakerStudio2/local_settings.json

    - name: Instalar GameMaker Oficial vía Homebrew
      run: |
        # Homebrew es el gestor de paquetes oficial de Mac. Descarga la versión completa estable directamente.
        brew install --cask gamemaker

    - name: Compilar Proyecto iOS con Xcode
      run: |
        # Buscamos el ejecutable Igor dentro de la app oficial ya instalada
        /Applications/GameMaker.app/Contents/MacOS/Igor \
        --uf ~/.config/GameMakerStudio2 \
        --project "${{ github.workspace }}/SMM_WE.yyp" \
        --config "Default" \
        --platform "iOS" \
        --Package \
        -- xcode-arguments 'CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""'

    - name: Subir Archivo IPA Terminado
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-ipa
        path: |
          **/*.ipa
          **/*.xcarchive
