name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Configurar Credenciales de GameMaker
      run: |
        mkdir -p ~/.config/GameMakerStudio2
        echo '{
          "login": "${{ secrets.GM_USERNAME }}",
          "password": "${{ secrets.GM_PASSWORD }}",
          "will_login": true
        }' > ~/.config/GameMakerStudio2/local_settings.json

    - name: Instalar GameMaker Oficial vía Homebrew
      run: |
        brew install --cask gamemaker

    - name: Descargar Runtime de Compilación
      run: |
        # Ejecutamos la aplicación de GameMaker en modo headless para que inicie sesión y descargue el compilador Igor
        /Applications/GameMaker.app/Contents/MacOS/GameMaker \
          --headless \
          --user-settings ~/.config/GameMakerStudio2/local_settings.json \
          --runtime-install "2024.6.1.208"

    - name: Compilar Proyecto iOS con Xcode
      run: |
        # Usamos la ruta universal de runtimes compartidos en macOS
        /Users/Shared/GameMakerStudio2/Cache/runtimes/runtime-2024.6.1.208/bin/igor/osx/arm64/Igor \
        --uf ~/.config/GameMakerStudio2 \
        --project "${{ github.workspace }}/SMM_WE.yyp" \
        --config "Default" \
        --platform "iOS" \
        --Package \
        -- xcode-arguments 'CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""'

    - name: Subir Archivo IPA Terminado
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-ipa
        path: |
          **/*.ipa
          **/*.xcarchive
