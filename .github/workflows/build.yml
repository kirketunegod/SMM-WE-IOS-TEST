name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Configurar Credenciales de GameMaker
      run: |
        mkdir -p ~/.config/GameMakerStudio2
        echo '{
          "login": "${{ secrets.GM_USERNAME }}",
          "password": "${{ secrets.GM_PASSWORD }}",
          "will_login": true
        }' > ~/.config/GameMakerStudio2/local_settings.json

    - name: Descargar y Descomprimir Runtime Oficial
      run: |
        # Creamos nuestra propia carpeta para el compilador
        mkdir -p ${{ github.workspace }}/gm_runtime
        
        # Descargamos el archivo ZIP del runtime oficial directo desde los servidores de YoYo Games
        curl -L -o runtime.zip "https://gamemaker.io"
        
        # Descomprimimos el entorno de desarrollo en nuestra carpeta
        unzip -q runtime.zip -d ${{ github.workspace }}/gm_runtime

    - name: Compilar Proyecto iOS con Xcode
      run: |
        # Damos permisos de ejecución al ejecutable de Igor que acabamos de descargar
        chmod +x ${{ github.workspace }}/gm_runtime/bin/igor/osx/arm64/Igor
        
        # Ejecutamos Igor directamente desde nuestra ruta controlada
        ${{ github.workspace }}/gm_runtime/bin/igor/osx/arm64/Igor \
        --uf ~/.config/GameMakerStudio2 \
        --rp "${{ github.workspace }}/gm_runtime" \
        --project "${{ github.workspace }}/SMM_WE.yyp" \
        --config "Default" \
        --platform "iOS" \
        --Package \
        -- xcode-arguments 'CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""'

    - name: Subir Archivo IPA Terminado
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-ipa
        path: |
          **/*.ipa
          **/*.xcarchive
