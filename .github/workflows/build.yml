name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Instalar GameMaker de Producción
      run: |
        # Instalamos la app oficial de GameMaker a través de Homebrew
        brew install --cask gamemaker

    - name: Iniciar Sesión y Descargar Runtime Oficial
      run: |
        # Creamos las carpetas de caché requeridas por el sistema de licencias de YoYo Games
        mkdir -p ~/.config/GameMakerStudio2
        mkdir -p /Users/runner/Library/Application\ Support/GameMakerStudio2/Cache/runtimes
        
        # Guardamos tus credenciales en el archivo de inicio de sesión oficial
        echo '{
          "login": "${{ secrets.GM_USERNAME }}",
          "password": "${{ secrets.GM_PASSWORD }}",
          "will_login": true
        }' > ~/.config/GameMakerStudio2/local_settings.json

        # Ejecutamos la aplicación oficial de GameMaker en modo silencioso.
        # Al pasarle tus credenciales, se conectará al servidor oficial de licencias de forma segura,
        # detectará la versión de tu proyecto 'SMM_WE.yyp' y descargará automáticamente el compilador Igor funcional.
        /Applications/GameMaker.app/Contents/MacOS/GameMaker \
          --headless \
          --user-settings ~/.config/GameMakerStudio2/local_settings.json \
          --project "${{ github.workspace }}/SMM_WE.yyp" \
          --runtime-target "ios"

    - name: Localizar Compilador y Ejecutar Xcode
      run: |
        # Buscamos la ubicación dinámica de Igor que acaba de descargar la aplicación oficial
        IGOR_PATH=$(find /Users/runner/Library/Application\ Support/GameMakerStudio2/Cache/runtimes -name "Igor" -type f | head -n 1)
        RUNTIME_DIR=$(dirname $(dirname $(dirname $(dirname "$IGOR_PATH"))))
        
        echo "Compilador Igor encontrado en: $IGOR_PATH"
        echo "Directorio del Runtime: $RUNTIME_DIR"
        
        # Le damos permisos de ejecución al binario nativo de Mac
        chmod +x "$IGOR_PATH"
        
        # Ejecutamos la compilación definitiva de tu juego
        "$IGOR_PATH" \
          --uf ~/.config/GameMakerStudio2 \
          --rp "$RUNTIME_DIR" \
          --project "${{ github.workspace }}/SMM_WE.yyp" \
          --config "Default" \
          --platform "iOS" \
          --Package \
          -- xcode-arguments 'CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""'

    - name: Subir Archivo IPA Terminado
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-ipa
        path: |
          **/*.ipa
          **/*.xcarchive
