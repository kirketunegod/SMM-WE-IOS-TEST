name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # Updated to the latest stable macOS environment

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up GameMaker Igor Compiler
      uses: bscotch/igor-setup@v1
      with:
        # We target your specific yyp file so it fetches the correct runtime version automatically
        target-yyp: 'SMM_WE.yyp' 

    - name: Compile iOS Project
      uses: bscotch/igor-build@v1
      with:
        project-path: 'SMM_WE.yyp'
        target: 'ios'
        command: 'package'

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-ipa
        path: |
          **/*.ipa
          **/*.xcarchive

