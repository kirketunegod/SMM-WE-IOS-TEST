name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up GameMaker Igor Compiler
      uses: bscotch/igor-setup@v1
      with:
        target-yyp: 'SMM_WE.yyp' 

    - name: Compile iOS Project
      uses: bscotch/igor-build@v1
      with:
        project-path: 'SMM_WE.yyp'
        target: 'ios'
        command: 'package'
        username: ${{ secrets.GM_USERNAME }}
        password: ${{ secrets.GM_PASSWORD }}
        # Forces Xcode to bundle the app without demanding a premium Apple ID profile
        xcode-arguments: 'CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""'

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-ipa
        path: |
          **/*.ipa
          **/*.xcarchive
