name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Uses an Intel-based Mac runner to bypass ARM64 queue wait times

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Download and Install GameMaker
      run: |
        curl -L -o GameMaker.pkg "https://gamemaker.io"
        sudo installer -pkg GameMaker.pkg -target /

    - name: Compile iOS Project
      run: |
        # Change YOUR_PROJECT_NAME.yyp to your actual file name
        /Applications/GameMaker.app/Contents/MacOS/Igor \
        --project "${{ github.workspace }}/SMM_WE.yyp" \
        --config "Default" \
        --platform "iOS" \
        --Package

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-ipa
        path: |
          **/*.ipa
          **/*.xcarchive
