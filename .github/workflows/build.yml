name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Configurar Credenciales de GameMaker
      run: |
        mkdir -p ~/.config/GameMakerStudio2
        echo '{
          "login": "${{ secrets.GM_USERNAME }}",
          "password": "${{ secrets.GM_PASSWORD }}",
          "will_login": true
        }' > ~/.config/GameMakerStudio2/local_settings.json

    - name: Descargar e Instalar GameMaker
      run: |
        # Usamos la URL directa del paquete de instalación oficial para Mac
        curl -L -o GameMaker.pkg "https://gamemaker.io"
        sudo installer -pkg GameMaker.pkg -target /

    - name: Compilar Proyecto iOS con Xcode
      run: |
        /Applications/GameMaker.app/Contents/MacOS/Igor \
        --uf ~/.config/GameMakerStudio2 \
        --project "${{ github.workspace }}/SMM_WE.yyp" \
        --config "Default" \
        --platform "iOS" \
        --Package \
        -- xcode-arguments 'CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""'

    - name: Subir Archivo IPA Terminado
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-ipa
        path: |
          **/*.ipa
          **/*.xcarchive
