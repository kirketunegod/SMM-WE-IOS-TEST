name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Sticking to Intel macOS to avoid long M1/M2 queue times

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up GameMaker Igor Compiler
      uses: bscotch/igor-setup@v1
      with:
        # Installs the stable standalone GameMaker build tools
        version: '2024.6.1.208' 

    - name: Compile iOS Project
      uses: bscotch/igor-build@v1
      with:
        # !!! REPLACE THIS WITH YOUR EXACT FILE NAME !!!
        project-path: 'SMM_WE.yyp'
        target: 'ios'
        command: 'package'

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-ipa
        path: |
          **/*.ipa
          **/*.xcarchive
